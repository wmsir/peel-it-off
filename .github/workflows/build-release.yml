name: Build Android APK & Package WeChat MiniProgram

on:
  push:
    branches: ["main", "master"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-all:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Sync shared assets & run full verification
        run: |
          node scripts/sync-assets.js
          node scripts/verify-all.js

      - name: Package WeChat Mini-Program bundle (.zip)
        run: |
          mkdir -p dist
          (cd wechat-miniprogram && zip -r ../dist/peel-it-off-wechat-miniprogram.zip .)

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Decode optional Android Release Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Release keystore detected and decoded."
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret set; Release APK will use debug signing for instant phone install."
          fi

      - name: Build Android Debug & Release APKs
        working-directory: android-app
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Collect build outputs
        run: |
          mkdir -p dist
          cp android-app/app/build/outputs/apk/debug/app-debug.apk dist/peel-it-off-debug.apk
          cp android-app/app/build/outputs/apk/release/app-release.apk dist/peel-it-off-release.apk
          ls -lh dist/

      - name: Upload Android APKs & WeChat MiniProgram Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: peel-it-off-builds
          path: |
            dist/peel-it-off-debug.apk
            dist/peel-it-off-release.apk
            dist/peel-it-off-wechat-miniprogram.zip

      - name: Publish GitHub Release on version tag (v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/peel-it-off-debug.apk
            dist/peel-it-off-release.apk
            dist/peel-it-off-wechat-miniprogram.zip
